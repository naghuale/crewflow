# crewflow settings for crewflow itself. See docs/DESIGN.md §5.

[project]
repo = "naghuale/crewflow"
default_branch = "main"
language = "ru"

[identity]
# The executor works as the bot of the GitHub App crewflow-executor (§7i): a token of an
# hour for this repository, pushes of the branch of its task only. The owner decided it
# on 2026-09-28.
mode = "bot"

[identity.github_app]
app_id = 5107052
installation_id = 165781718

[orchestrator]
# The orchestrator works as the bot of the second GitHub App of this project,
# crewflow-orchestrator (App 5140522), whose key the owner imported into the keychain on
# 2026-10-01 (crewflow#95): the record of a review and the push of an approved commit are
# written under an account of its own, and the decisions of the owner the gate counts from
# [merge] owners below — from the login of the App it counts nothing (§7i).
mode = "separate"

[orchestrator.github_app]
app_id = 5140522
installation_id = 0

[executor]
command = ["opencode", "run", "--dir", "{worktree}", "--format", "json", "{prompt}"]
timeout = "120m"

[access]
# The caches and the toolchain the executor may read outside the worktree (§7d).
# The paths are different on every machine, so the project says how to find them.
read_from = [["go", "env", "GOMODCACHE"], ["go", "env", "GOROOT"]]
read = []

[worktrees]
root = "~/.crewflow/worktrees/{repo}"

[[gates]]
name = "format"
run = ["sh", "-c", "test -z \"$(gofmt -l .)\""]

[[gates]]
name = "vet"
run = ["go", "vet", "./..."]

[[gates]]
name = "test"
run = ["go", "test", "-race", "-count=1", "./..."]

[[gates]]
name = "lint"
run = ["golangci-lint", "run", "--timeout", "5m", "./..."]

[[gates]]
name = "tidy"
run = ["go", "mod", "tidy", "-diff"]

[[gates]]
# The journal of this project is written by its tasks as fragments in changelog.d/,
# and this gate is what keeps it a journal and not a pile: every fragment is a
# fragment, every fragment is a task of the project, no two of them say one thing,
# and CHANGELOG.md is what they build (§6). It is the only gate here that asks the
# host — the number in the name of a fragment has to be a task that exists — so it
# runs after the format of the code, where the toolchain is already warm.
name = "changelog"
run = ["go", "run", "./cmd/crewflow", "changelog", "check"]

[[gates]]
# A secret in a commit of the branch, found by gitleaks. Only the commits of the
# branch are scanned: origin/main is the base a worktree of a task starts from, and
# what is not a secret stands in .gitleaks.toml — a value the project knows to be
# public, or a value of the test data with the mark that says it is a placeholder.
# --redact keeps the value out of the output of a finding: a check that prints a
# secret of a person has told one person too many.
name = "secrets"
run = ["sh", "-c", "gitleaks git --redact --config .gitleaks.toml --log-opts=origin/main..HEAD"]

[ci]
required = true
timeout = "30m"

[merge]
by = "orchestrator"
strategy = "ff-only"
# Логины, чья запись ревью считается одобрением (§7h). В режиме separate это учётная
# запись App оркестратора: список назван явно, а не пустым, — иначе пустым он был бы
# логин владельца, то есть запись ревью пришлось бы писать под ним. Запись исполнителя
# (App) одобрением не считается.
reviewers = ["crewflow-orchestrator[bot]"]
# Логины, чьи записи считаются решением владельца (§7h): приёмка результата
# (`ACCEPTED <sha>`) и `SCOPE: ACCEPTED` — файл вне границ задачи. Пусто — владелец
# репозитория. Оркестратора в режиме separate (§7i) здесь нет: он пишет запись
# ревью, а решение владельца — нет. Имя названо явно, а не пустым списком: в этом
# режиме файл с владельцем среди reviewers или с одним логином в обоих списках не
# читается вовсе (crewflow#95).
owners = ["naghuale"]

[acceptance]
# Метка задачи, результат которой владелец принимает до слияния: без записи
# `ACCEPTED <sha головы>` под PR gate отказывает (owner-acceptance-missing).
label = "owner-check"

[parallel]
max_tasks = 1

[tasks]
owner_approval = "risky"

[requirements]
tools = [
  { name = "go", check = ["go", "version"], min = "1.27" },
  { name = "golangci-lint", check = ["golangci-lint", "version"], min = "2.14" },
  # The gate secrets is a script of sh, and doctor checks the shell alone: the
  # program the script calls is named here, so that a machine without gitleaks is
  # told so before a task of it is run.
  { name = "gitleaks", check = ["gitleaks", "version"], min = "8.30" },
]

[isolation]
mode = "host"
