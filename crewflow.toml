# crewflow settings for crewflow itself. See docs/DESIGN.md §5.

[project]
repo = "naghuale/crewflow"
default_branch = "main"
language = "ru"

[identity]
# The executor works as the bot of the GitHub App crewflow-executor (§7i): a token of an
# hour for this repository, pushes of the branch of its task only. The owner decided it
# on 2026-09-28.
mode = "bot"

[identity.github_app]
app_id = 5107052
installation_id = 165781718

[executor]
command = ["opencode", "run", "--dir", "{worktree}", "--format", "json", "{prompt}"]
timeout = "120m"

[access]
# The caches and the toolchain the executor may read outside the worktree (§7d).
# The paths are different on every machine, so the project says how to find them.
read_from = [["go", "env", "GOMODCACHE"], ["go", "env", "GOROOT"]]
read = []

[worktrees]
root = "~/.crewflow/worktrees/{repo}"

[[gates]]
name = "format"
run = ["sh", "-c", "test -z \"$(gofmt -l .)\""]

[[gates]]
name = "vet"
run = ["go", "vet", "./..."]

[[gates]]
name = "test"
run = ["go", "test", "-race", "-count=1", "./..."]

[[gates]]
name = "lint"
run = ["golangci-lint", "run", "--timeout", "5m", "./..."]

[[gates]]
name = "tidy"
run = ["go", "mod", "tidy", "-diff"]

[[gates]]
# A secret in a commit of the branch, found by gitleaks. Only the commits of the
# branch are scanned: origin/main is the base a worktree of a task starts from, and
# the known placeholders of the tests stand in .gitleaksignore. --redact keeps the
# value out of the output of a finding: a check that prints a secret of a person has
# told one person too many.
name = "secrets"
run = ["sh", "-c", "gitleaks git --redact --log-opts=origin/main..HEAD"]

[ci]
required = true
timeout = "30m"

[merge]
by = "orchestrator"
strategy = "ff-only"
# Логины, чья запись ревью считается одобрением (§7h). Пусто — владелец
# репозитория, то есть naghuale. Запись исполнителя (App) одобрением не считается.
reviewers = []
# Логины, чья запись приёмки считается приёмкой (§7h). Пусто — владелец
# репозитория. Принимает тот, кто смотрит результат своими глазами.
owners = []

[acceptance]
# Метка задачи, результат которой владелец принимает до слияния: без записи
# `ACCEPTED <sha головы>` под PR gate отказывает (owner-acceptance-missing).
label = "owner-check"

[parallel]
max_tasks = 1

[tasks]
owner_approval = "risky"

[requirements]
tools = [
  { name = "go", check = ["go", "version"], min = "1.27" },
  { name = "golangci-lint", check = ["golangci-lint", "version"], min = "2.14" },
  # The gate secrets is a script of sh, and doctor checks the shell alone: the
  # program the script calls is named here, so that a machine without gitleaks is
  # told so before a task of it is run.
  { name = "gitleaks", check = ["gitleaks", "version"], min = "8.30" },
]

[isolation]
mode = "host"
