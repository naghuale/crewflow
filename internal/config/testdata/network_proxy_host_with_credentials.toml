# A login and a password in an address of a proxy are a secret in the file of a project:
# they are in the store of secrets, under the name of the profile.

[project]
repo = "naghuale/crewflow"

[executor]
command = ["agent", "run", "{prompt}"]

[network]
mode = "proxy"
active_proxy = "home"

[network.proxies.home]
type = "http"
host = "http://ann:s3cret@192.0.2.10"
port = 1082
credentials = "none"