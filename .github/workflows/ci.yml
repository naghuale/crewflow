name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify modules
        run: |
          go mod verify
          go mod tidy -diff
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed:"; echo "$unformatted"; exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 ./...
      - name: Build
        env:
          CGO_ENABLED: "0"
        run: go build ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
      - name: Lint
        run: golangci-lint run --timeout 5m ./...

  # A check of its own, named `secrets`, so that a person sees which promise it keeps
  # and the rules of the branch can demand that one name. What is scanned is the
  # change and not every branch of the repository: a stub of a test in a branch that
  # is not merged is not a secret of this change, and a check that reported it painted
  # every pull request red (F-072, #37, 01.10, #91). On main the whole history is
  # walked once, where a secret of a rewritten branch is still in the history. What is
  # not a secret stands in .gitleaks.toml: a value this project knows to be public, or
  # a value of the test data with the mark that says it is a placeholder.
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          # The version of the [requirements] of crewflow.toml, and the hash from
          # gitleaks_8.30.1_checksums.txt of that release: a check that guards
          # secrets may not take a program over TLS alone.
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Secrets in the commits of the change
        if: github.event_name == 'pull_request'
        run: >-
          gitleaks git --redact --config .gitleaks.toml
          --log-opts=${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
      - name: Secrets in the history of main
        if: github.event_name != 'pull_request'
        run: gitleaks git --redact --config .gitleaks.toml --log-opts=${{ github.sha }}
      # The two promises of .gitleaks.toml are proved here, on every run of the check
      # and before it hides a real secret behind a rule that is too wide. The value of
      # a run of a test is built in the shell and not written into a file of the
      # repository: a token in a commit of it is a finding of this very check.
      - name: A marked placeholder passes, a value nobody marked does not
        run: |
          probe="$RUNNER_TEMP/secrets-probe"
          value="ghs_$(printf 'abcd1234ef567890%.0s' {1..2})wxyz"
          mkdir -p "$probe/testdata"
          printf '{"token": "%s", "_placeholder": "not a token of a run"}\n' "$value" > "$probe/testdata/marked.json"
          cd "$probe"
          git init -q .
          git add -A
          git -c user.email=probe@example.com -c user.name=probe commit -qm "a marked placeholder of the test data"
          if ! gitleaks git --redact --config "$GITHUB_WORKSPACE/.gitleaks.toml" --log-opts=HEAD --no-banner .; then
            echo "::error::a marked placeholder of the test data was reported as a secret"
            exit 1
          fi
          printf '{"token": "%s"}\n' "$value" > "$probe/testdata/unmarked.json"
          printf 'token = "%s"\n' "$value" > "$probe/ordinary.txt"
          git add -A
          git -c user.email=probe@example.com -c user.name=probe commit -qm "a value nobody marked"
          if gitleaks git --redact --config "$GITHUB_WORKSPACE/.gitleaks.toml" --log-opts=HEAD~1..HEAD --no-banner .; then
            echo "::error::a value nobody marked passed the check: .gitleaks.toml allows what it must not"
            exit 1
          fi
